name: Build Salam SIP Caller Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build_output/Salam_SIP_Caller_v2.6_debug.apk
          else
            find . -name "*.apk" -exec cp {} build_output/Salam_SIP_Caller_v2.6_debug.apk \;
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Salam_SIP_Caller_APK
          path: build_output/*.apk
          retention-days: 30
